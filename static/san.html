<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RackView — SAN Switch Mapping</title>
  <link rel="stylesheet" href="style.css" onerror="this.onerror=null;this.href='style.css?retry='+Date.now()">
</head>
<body>
  <header class="toolbar">
    <span class="title">RackView — SAN Switch Mapping</span>
    <div class="spacer"></div>
    <a class="btn-link" href="index.html">Back to rack</a>
  </header>

  <main class="san-page">
    <div class="san-input-col">
      <div class="san-field">
        <label for="san-switch-select">SAN switch (from rack)</label>
        <select id="san-switch-select"></select>
      </div>
      <div class="san-field-row">
        <div class="san-field">
          <label for="san-ip">IP address</label>
          <input id="san-ip" type="text" placeholder="192.168.1.10">
        </div>
        <div class="san-field">
          <label for="san-vendor">Vendor</label>
          <select id="san-vendor">
            <option value="brocade">Brocade (FOS)</option>
            <option value="cisco">Cisco MDS</option>
          </select>
        </div>
        <div class="san-field san-field-narrow">
          <label for="san-port">SSH port</label>
          <input id="san-port" type="text" placeholder="22">
        </div>
      </div>
      <div class="san-field-row">
        <div class="san-field">
          <label for="san-user">Username</label>
          <input id="san-user" type="text" autocomplete="off">
        </div>
        <div class="san-field">
          <label for="san-pass">Password</label>
          <input id="san-pass" type="password" autocomplete="off">
        </div>
      </div>
      <div class="san-hint">Username/password are used for this pull only — never saved. The IP, vendor, and the switch's own reported ports/zoning are kept so you don't need to re-enter credentials just to view the last pull.</div>
      <button id="btn-san-collect" class="primary">Pull SAN info</button>
      <div id="san-error" class="san-error"></div>
      <div id="san-last-pulled" class="san-hint"></div>
    </div>

    <div class="san-results-col">
      <div id="san-body"><div class="san-empty">Select a SAN switch and pull its info.</div></div>
    </div>
  </main>

  <script src="js/san.js"></script>
</body>
</html>
