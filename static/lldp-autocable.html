<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RackView — LLDP Auto-Cabling</title>
  <link rel="stylesheet" href="style.css" onerror="this.onerror=null;this.href='style.css?retry='+Date.now()">
</head>
<body>
  <header class="toolbar">
    <span class="title">RackView — LLDP Auto-Cabling</span>
    <div class="spacer"></div>
    <a class="btn-link" href="lldp.html">← LLDP Discovery</a>
    <a class="btn-link" href="index.html">Back to rack</a>
  </header>
  <div class="lldp-mode-hint">Creates, updates, and removes real cable connections based on LLDP. Review each row before applying.</div>

  <main class="lldp-page">
    <div class="lldp-input-col">
      <div class="lldp-field">
        <label for="lldp-switch-select">Source switch</label>
        <select id="lldp-switch-select"></select>
      </div>

      <div class="lldp-field">
        <label for="lldp-textarea">LLDP neighbor output</label>
        <textarea id="lldp-textarea" placeholder="Paste 'show lldp neighbors' (or equivalent) output here…"></textarea>
      </div>

      <div class="lldp-actions">
        <div class="dropdown">
          <button id="btn-load-sample">Load sample ▾</button>
          <div id="sample-menu" class="dropdown-menu">
            <button data-sample="lldp-cisco-nxos.txt">Cisco NX-OS / IOS</button>
            <button data-sample="lldp-dell-os10.txt">Dell OS10</button>
            <button data-sample="lldp-aruba.txt">Aruba / HPE</button>
          </div>
        </div>
        <button id="btn-parse" class="primary">Parse &amp; match</button>
      </div>
      <div id="lldp-parse-error" class="lldp-error"></div>

      <div class="lldp-history-section">
        <div class="lldp-history-title">History</div>
        <div id="lldp-history-list" class="lldp-history-list">
          <div class="lldp-empty">No discoveries yet.</div>
        </div>
      </div>
    </div>

    <div class="lldp-results-col">
      <div id="lldp-summary" class="lldp-summary"></div>
      <div class="lldp-results-header">
        <div class="lldp-chips" id="lldp-filter-chips">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="new">New</button>
          <button class="chip" data-filter="conflict">Changed</button>
          <button class="chip" data-filter="removed">Removed</button>
          <button class="chip" data-filter="matched">Matched</button>
        </div>
        <div class="lldp-header-actions">
          <button id="btn-view-on-rack" class="btn-link" style="display:none">View on rack</button>
          <button id="btn-apply-all" class="primary" disabled>Apply all changes</button>
        </div>
      </div>
      <div id="lldp-results-list" class="lldp-results-list">
        <div class="lldp-empty">Paste LLDP output (or load a sample) and click "Parse &amp; match".</div>
      </div>
    </div>
  </main>

  <script>window.LLDP_MODE = "autocable";</script>
  <script src="js/lldp.js"></script>
</body>
</html>
